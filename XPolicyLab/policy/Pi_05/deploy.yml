# Basic experiment configuration
policy_name: Pi_05
protocol: ws
host: localhost
# Local evaluation can block the event loop during first-time JAX compilation
# and Isaac scene setup. Disable WebSocket keepalive so that long inference
# does not get mistaken for a dead policy server.
ws_ping_interval_s: null
ws_ping_timeout_s: null
bench_name: null
task_name: null
env_cfg_type: null
seed: null
eval_batch: true

checkpoint_num: 59999
result_dir: "./results/pi05/"
obs_transform_pipeline: "xspark-v1.0"

# Model / action configuration
action_type: joint
policy_uv_env_path: openpi
# Must match the config used by train.sh (default OPENPI_TRAIN_CONFIG_NAME).
train_config_name: pi05_base_aloha_full_sim_arx-x5_seed_0
repo_id: arx_x5_sim

port: 6000
